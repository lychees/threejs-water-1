<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>怒海争锋 · Three.js 海战小游戏</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0a2a3a; font-family: "Microsoft YaHei", sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* ===== HUD ===== */
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  #top-bar { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 28px; font-size: 18px; font-weight: bold; }
  .stat { background: rgba(0, 20, 35, .45); padding: 6px 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,.25); }

  #hp-wrap { position: absolute; left: 24px; bottom: 24px; width: 260px; }
  .bar-label { font-size: 13px; margin-bottom: 4px; letter-spacing: 1px; }
  .bar { height: 16px; background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.4); border-radius: 8px; overflow: hidden; }
  .bar > div { height: 100%; transition: width .15s; }
  #hp-fill { width: 100%; background: linear-gradient(90deg, #e74c3c, #2ecc71); }
  #sail-state { margin-top: 8px; font-size: 14px; }

  #reload-wrap { position: absolute; right: 24px; bottom: 24px; width: 220px; text-align: right; }
  .reload-row { margin-top: 6px; font-size: 14px; }
  .reload-bar { height: 8px; background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.35); border-radius: 4px; overflow: hidden; margin-top: 2px; }
  .reload-bar > div { height: 100%; background: #f1c40f; width: 100%; }

  #help { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); font-size: 12.5px; opacity: .85; background: rgba(0,20,35,.4); padding: 6px 14px; border-radius: 8px; white-space: nowrap; }

  /* ===== 遮罩 ===== */
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(4, 24, 40, .78); color: #fff; z-index: 10; text-align: center; }
  .overlay h1 { font-size: 44px; margin: 0 0 12px; letter-spacing: 6px; }
  .overlay p { font-size: 16px; line-height: 1.9; margin: 4px 0; opacity: .9; }
  .overlay button { margin-top: 26px; font-size: 20px; padding: 12px 46px; border: none; border-radius: 30px; cursor: pointer; background: #e8a33d; color: #3a2405; font-weight: bold; letter-spacing: 4px; }
  .overlay button:hover { background: #f5bc63; }
  .hidden { display: none !important; }

  /* ===== 拾取飘字 ===== */
  .float-text { position: absolute; left: 50%; bottom: 30%; transform: translateX(-50%); font-size: 22px; font-weight: bold; color: #ffd76e; text-shadow: 0 2px 6px rgba(0,0,0,.7); animation: floatUp 1.5s ease-out forwards; pointer-events: none; }
  @keyframes floatUp {
    0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
    15% { opacity: 1; }
    100% { opacity: 0; transform: translateX(-50%) translateY(-70px); }
  }

  /* ===== 选船卡片（可滚动网格） ===== */
  #start-overlay { justify-content: flex-start; overflow-y: auto; padding: 5vh 16px; }
  #ship-select { display: grid; grid-template-columns: repeat(5, 168px); gap: 12px; margin-top: 22px; max-height: 52vh; overflow-y: auto; padding: 6px; }
  .ship-card { position: relative; background: rgba(0, 20, 35, .55); border: 2px solid rgba(255,255,255,.2); border-radius: 12px; padding: 10px; cursor: pointer; transition: border-color .15s, transform .15s, box-shadow .15s; }
  .ship-card:hover { transform: translateY(-3px); border-color: rgba(232,163,61,.6); }
  .ship-card.selected { border-color: #e8a33d; box-shadow: 0 0 14px rgba(232,163,61,.45); }
  .ship-card img { width: 100%; border-radius: 8px; display: block; background: rgba(255,255,255,.06); }
  .ship-card .thumb-fallback { width: 100%; aspect-ratio: 2; border-radius: 8px; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: 14px; opacity: .7; }
  .ship-card .badge { position: absolute; top: 14px; left: 14px; background: #e8a33d; color: #3a2405; font-size: 10px; font-weight: bold; padding: 2px 7px; border-radius: 8px; }
  .ship-card h3 { margin: 8px 0 2px; font-size: 15px; letter-spacing: 2px; font-weight: bold; }
  .ship-card .en-name { font-size: 10.5px; opacity: .6; margin-bottom: 6px; letter-spacing: .5px; }
  .stat-row { display: flex; align-items: center; gap: 6px; font-size: 11px; margin-top: 3px; }
  .stat-row .lbl { width: 18px; text-align: center; opacity: .85; }
  .stat-row .sbar { flex: 1; height: 6px; background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.2); border-radius: 3px; overflow: hidden; }
  .stat-row .sbar > div { height: 100%; background: #e8a33d; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>

<!-- 游戏内 HUD -->
<div id="hud" class="hidden">
  <div id="top-bar">
    <div class="stat">击沉 <span id="kills">0</span></div>
    <div class="stat">战利品 <span id="loot">0</span></div>
    <div class="stat">第 <span id="wave">1</span> 波</div>
  </div>
  <div id="hp-wrap">
    <div class="bar-label">船体耐久</div>
    <div class="bar"><div id="hp-fill"></div></div>
    <div id="sail-state">帆位：降帆</div>
  </div>
  <div id="reload-wrap">
    <div class="reload-row">左舷（鼠标左键 / Q）<div class="reload-bar"><div id="reload-l"></div></div></div>
    <div class="reload-row">右舷（鼠标右键 / E）<div class="reload-bar"><div id="reload-r"></div></div></div>
  </div>
  <div id="help">W/S 升降帆调速 · A/D 转向 · 移动鼠标环视 · 左键/Q 左舷齐射 · 右键/E 右舷齐射</div>
</div>

<!-- 开始遮罩 -->
<div id="start-overlay" class="overlay">
  <h1>怒 海 争 锋</h1>
  <p>W / S —— 升帆加速 / 降帆减速（共三档帆位）</p>
  <p>A / D —— 左转 / 右转</p>
  <p>移动鼠标 —— 环绕视角</p>
  <p>鼠标左键 / Q —— 左舷齐射　　鼠标右键 / E —— 右舷齐射</p>
  <p>把敌船引到舷侧再开火，击沉它们！</p>
  <div id="ship-select"></div>
  <button id="start-btn">出 航</button>
</div>

<!-- 结束遮罩 -->
<div id="gameover-overlay" class="overlay hidden">
  <h1>船 沉 了 …</h1>
  <p>本次战绩：击沉敌船 <span id="final-kills">0</span> 艘 · 战利品 <span id="final-loot">0</span> 件</p>
  <p>按 R 重新开始</p>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
